<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Operacional</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">

    <header class="header">
      <div>
        <h1>📊 Dashboard Operacional</h1>
        <p>Google Sheets + GitHub Pages + Power BI</p>
      </div>
      <div class="header-badge">Supervisão Operacional</div>
    </header>

    <div id="erro" class="erro" style="display:none;"></div>

    <section class="cards" id="cards">
      <div class="loading">Carregando dados...</div>
    </section>

    <section class="content">
      <div class="table-box">
        <h2>Ranking de Operadores</h2>
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Operador</th>
              <th>Volume</th>
            </tr>
          </thead>
          <tbody id="ranking"></tbody>
        </table>
      </div>

      <aside class="side-panel">
        <div class="box">
          <h2>Alertas</h2>
          <div id="alertas"></div>
        </div>

        <div class="box">
          <h2>Status</h2>
          <div id="status"></div>
        </div>

        <div class="box">
          <h2>Bases carregadas</h2>
          <div id="bases"></div>
        </div>
      </aside>
    </section>

  </div>

  <script src="app.js"></script>
</body>
</html>
